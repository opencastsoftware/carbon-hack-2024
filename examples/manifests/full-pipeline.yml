name: full-pipeline
description: test starting from observations
tags:
initialize:
  plugins:
    teads-curve: 
      path: '@grnsft/if-unofficial-plugins'
      method: TeadsCurve
      global-config:
        interpolation: spline
    group-by:
      path: "builtin"
      method: GroupBy
    cloud-metadata:
      method: CloudMetadata
      path: "@grnsft/if-plugins"   
    sci-e:
      method: SciE
      path: "@grnsft/if-plugins"
    watt-time:
      method: WattTimeGridEmissions
      path: '@grnsft/if-unofficial-plugins'
    sci-o:
      verbose: false
      method: SciO
      path: "@grnsft/if-plugins"
    sci-m: # a model that calculates m from te, tir, el, rr and rtor
      method: SciM
      verbose: false
      path: "@grnsft/if-plugins"
    sci:
      kind: plugin
      method: Sci
      path: "@grnsft/if-plugins"
    swi:
      method: SWI
      path: "swi"
    # risk-scorecard:
    #   method: RiskScorecard
    #   path: 'risk-scorecard'
    #   global-config:
    #     keep-exisiting: true
tree:
  children:
    child-0:
      defaults:
        device/emissions-embodied: 1533.120 # gCO2eq
        country: United States
        device/expected-lifespan: 94608000 # 3 years in seconds
      config:
        group-by:
          group:
            - cloud/region
        sci:
          functional-unit-time: 1 sec
          functional-unit: requests # factor to convert per time to per f.unit
      pipeline:
        - group-by
        - cloud-metadata
        - teads-curve
        - watt-time
        - sci-e
        - sci-o
        - sci-m
        - sci
        # - swi
        # - risk-scorecard
      inputs:
        - timestamp: 2024-04-02T00:00
          duration: 30
          cpu/utilization: 20
          cloud/instance-type: Standard_A1_v2
          cloud/vendor: azure
          cloud/region: westus3
          requests: 12
        - timestamp: 2024-04-02T00:30
          duration: 30
          cpu/utilization: 80
          cloud/instance-type: Standard_A1_v2
          cloud/region: westus3
          cloud/vendor: azure
          requests: 5
        - timestamp: 2024-04-02T01:00
          duration: 30
          cpu/utilization: 20
          cloud/instance-type: Standard_A1_v2
          cloud/region: westus3
          cloud/vendor: azure
          requests: 29
        